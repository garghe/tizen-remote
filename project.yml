name: TizenRemote
options:
  bundleIdPrefix: com.garghe
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  TizenRemote:
    type: application
    platform: iOS
    sources:
      - TizenRemote
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.garghe.tizenremote
        INFOPLIST_FILE: TizenRemote/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
